name: I/O VM source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    name: Archive and publication contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python tools and package contracts
        run: |
          make test
          python3 -B tools/build.py --help
          python3 -B tools/publish.py --help
          python3 -B tests/io-vm/verify.py --help
          python3 -B tests/io-vm/tap-offload.py --help
      - name: Check control, retirement and network activation
        run: |
          for test in control retirement network; do
            cc -O2 -Wall -Wextra -Werror -Iinclude "tests/io-vm/$test.c" -o "/tmp/hyper-$test-test"
            "/tmp/hyper-$test-test"
          done
      - name: Compile the Linux vhost-scsi acceptance fixture
        run: cc -static -O2 -Wall -Wextra -Werror tests/io-vm/vhost-scsi.c -o /tmp/vhost-scsi-test
      - name: Compile the Linux TAP offload acceptance fixture
        run: cc -static -O2 -Wall -Wextra -Werror tests/io-vm/tap-offload.c -o /tmp/tap-offload-test
